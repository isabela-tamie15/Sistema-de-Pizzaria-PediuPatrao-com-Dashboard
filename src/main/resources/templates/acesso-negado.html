<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Negado - PediuPatrão</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<!-- PARTE 2: mesmo visual da página error.html -->
<!-- Antes dizia que a funcionalidade era exclusiva do GERENTE, mas agora cada perfil tem bloqueios diferentes -->
<!-- (ex: o ATENDENTE não acessa o dashboard e o ADMIN não cria pedidos), então a mensagem ficou geral -->
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<div class="text-center px-4" style="max-width: 520px;">

  <!-- Código do erro -->
  <div class="display-1 fw-bold text-danger">403</div>

  <!-- Ícone -->
  <div class="my-3">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
  </div>

  <h2 class="fw-bold mb-2">Acesso negado</h2>

  <p class="text-muted mb-4">Você não tem permissão para acessar este recurso.</p>

  <!-- Botões de ação -->
  <div class="d-flex gap-2 justify-content-center">
    <a th:href="@{/}" class="btn btn-primary">
      <i class="bi bi-house me-1"></i> Voltar para Home
    </a>
    <a href="javascript:history.back()" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left me-1"></i> Página anterior
    </a>
  </div>

</div>

</body>
</html>
